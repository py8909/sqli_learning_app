<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理者画面</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fa; }
    table {
      border-collapse: collapse;
      background: #fff;
      margin: 20px auto;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: center;
    }
    th {
      background: #eef3f8;
      font-weight: bold;
    }
    .ok { color: green; font-weight: bold; }
    .ng { color: red; font-weight: bold; }
  </style>
</head>
<body>

<h2 style="text-align:center">演習達成状況（管理者）</h2>

<table>
  <tr>
    <th>ユーザー</th>
    {% for ex in exercises %}
      <th>{{ exercise_labels[ex] }}</th>
    {% endfor %}
  </tr>

  {% for u in users %}
  <tr>
    <td><strong>{{ u.username }}</strong></td>
    {% for ex in exercises %}
      {% if u.progress.get(ex) %}
        <td class="ok">✔</td>
      {% else %}
        <td class="ng">✘</td>
      {% endif %}
    {% endfor %}
  </tr>
  {% endfor %}
</table>

</body>
</html>
