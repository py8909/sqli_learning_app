<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>小テスト：イントロダクション確認</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        margin: 0; padding: 0;
    }

    /* --- Header --- */
    .header {
        background: #2c3e50;
        color: white;
        padding: 15px 20px;
        font-size: 22px;
        font-weight: bold;
        position: relative;
    }

    .header-sub {
        font-size: 13px;
        font-weight: normal;
        color: #bdc3c7;
        margin-top: 4px;
    }

    .menu {
            display: none;
            position: absolute;
            right: 20px;
            top: 50px;
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            width: 180px;
        }

        .menu a {
            display: block;
            padding: 10px;
            margin-bottom: 5px;
            background: #bdc3c7;
            border-radius: 5px;
            text-decoration: none;
            color: black;
        }

        .menu a:hover {
            background: #d0d6db;
        }

    /* Layout */
    .container {
        max-width: 900px;
        margin: 30px auto 40px;
        padding: 0 15px;
    }

    /* Card */
    .card {
        background: #fff;
        border-radius: 10px;
        padding: 20px 22px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    .card-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .card-subtitle {
        font-size: 13px;
        color: #7f8c8d;
        margin-bottom: 14px;
    }

    .question {
        font-size: 15px;
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 8px;
        color: #34495e
    }

    .option {
        margin-left: 18px;
        margin-bottom: 6px;
    }

    .btn-primary {
        background: #3498db;
        padding: 10px 16px;
        color: white;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        margin-top: 20px;
        font-size: 15px;
    }

    .btn-primary:disabled {
        background: #9ec9e8;
        cursor: not-allowed;
    }

    .result {
        background: #f0f7ff;
        padding: 12px;
        border-radius: 7px;
        margin-top: 10px;
    }

    .correct {
        color: #27ae60;
        font-weight: bold;
    }

    .incorrect {
        color: #c0392b;
        font-weight: bold;
    }

    .explanation {
        margin-top: 8px;
        padding: 10px;
        background: #f9fbff;
        border-left: 4px solid #72a3f7;
        border-radius: 6px;
        font-size: 13px;
        display: none;
    }

    .link {
        margin-top: 4px;
    }

</style>
</head>

<body>

<!-- Header -->
<div class="header">
    SQLi Learning
    <div class="header-sub">演習メニュー &gt; SQLi 理解度確認テスト
    </div>
</div>

<div class="container">

    <div class="card">
        <div class="card-title">小テスト（全17問）</div>
        <div class="card-subtitle">ページを開くたびに問題がランダム表示されます</div>

        <form id="quizForm"></form>

        <button id="finishBtn" class="btn-primary" onclick="checkAnswers()">解答完了</button>

        <div id="resultArea"></div>
    </div>

</div>

<script>
/* ===================================
   小テストデータ（演習1〜8 総復習）
   =================================== */
const questions = [
    /* ---- 演習1：ログインSQLi ---- */
    {
        q: "ログイン画面でよくあるSQLインジェクション脆弱性の原因はどれ？",
        type: "single",
        options: [
            "ユーザ名とパスワードを暗号化している",
            "SQL文を文字列連結で組み立てている",
            "DBに INDEX が貼られていない",
            "ログイン画面が1つしかない"
        ],
        answer: ["1"],
        explanation: "文字列連結はSQLiの主要原因です。パラメトリクエリが必要です。",
        link: "/exercise1"
    },

    {
        q: "ログインSQLiで ' OR '1'='1 -- を入力するとどうなる？",
        type: "single",
        options: [
            "常にログイン成功する可能性がある",
            "パスワードが自動生成される",
            "ログイン画面が壊れる",
            "必ずログイン失敗する"
        ],
        answer: ["0"],
        explanation: "WHERE 条件が常に真になり認証回避されます。",
        link: "/exercise1"
    },

    /* ---- 演習2：検索フォームSQLi ---- */
    {
        q: "検索フォームで `' UNION SELECT ...` が成立する理由は？",
        type: "single",
        options: [
            "UNIONは常に無視されるため",
            "検索語がLIKE句なので安全",
            "結果の列数が一致すれば結合できるため",
            "フロントエンドで自動検知できるため"
        ],
        answer: ["2"],
        explanation: "UNION攻撃は列数が一致すると成立します。",
        link: "/exercise2"
    },

    {
        q: "検索フォームでのSQLiによって可能になること（複数選択）",
        type: "multi",
        options: [
            "テーブル名の取得",
            "DB内のデータ列挙",
            "サーバー内のファイルを削除",
            "アプリの検索結果を改ざん"
        ],
        answer: ["0", "1", "3"],
        explanation: "UNIONやエラー表示から内部情報が漏洩します。",
        link: "/exercise2"
    },

    /* ---- 演習3：URLパラメータ ---- */
    {
        q: "URLパラメータ SQLi の特徴として正しいのは？",
        type: "single",
        options: [
            "ユーザはURLを変更できない",
            "GETパラメータがそのままSQLに入ることが多い",
            "POSTより安全である",
            "攻撃に認証が必要である"
        ],
        answer: ["1"],
        explanation: "URLは自由に変更可能で、直接SQLに埋め込まれることが多く危険です。",
        link: "/exercise3"
    },

    {
        q: "URLパラメータで `1 OR 1=1` を入れた場合の典型的な挙動は？",
        type: "single",
        options: [
            "常に0件になる",
            "SQL構文エラーになる",
            "全件ヒットする可能性がある",
            "URLが無効化される"
        ],
        answer: ["2"],
        explanation: "Boolean-based TRUE となり全件取得されます。",
        link: "/exercise3"
    },

    /* ---- 演習4：エラーベース ---- */
    {
        q: "エラーベース SQLi が成立する条件は？",
        type: "single",
        options: [
            "エラーがユーザに表示される",
            "SQL文が暗号化されている",
            "JSONレスポンスのみ",
            "ログインが必要"
        ],
        answer: ["0"],
        explanation: "エラーメッセージがそのまま漏れるとSQL構造が推測可能です。",
        link: "/exercise4"
    },

    {
        q: "エラーメッセージをそのまま返すと何が起こる？（複数選択）",
        type: "multi",
        options: [
            "テーブル構造が推測される",
            "列数が推測される",
            "攻撃が困難になる",
            "SQL文の内部構造が漏れる"
        ],
        answer: ["0","1","3"],
        explanation: "エラーは攻撃者へのヒントになりやすい情報漏えいです。",
        link: "/exercise4"
    },

    /* ---- 演習5：ブラインド ---- */
    {
        q: "ブラインドSQLインジェクションの主な識別方法はどれ？",
        type: "single",
        options: [
            "サーバーの音を聞く",
            "レスポンス長・ステータス・時間差",
            "DB管理者に聞く",
            "ログイン成功メッセージ"
        ],
        answer: ["1"],
        explanation: "画面に結果が出ないため、挙動の差から推測します。",
        link: "/exercise5"
    },

    {
        q: "Time-based Blind SQLi の特徴は？",
        type: "single",
        options: [
            "DB が即応答する",
            "SQLがキャッシュされる",
            "条件が真のときのみ待機時間が発生する",
            "パスワードを自動生成する"
        ],
        answer: ["2"],
        explanation: "sleep() などで時間差が生じるのが特徴です。",
        link: "/exercise5"
    },

    /* ---- 演習6：静的解析 ---- */
    {
        q: "静的解析で SQLi を検出する主な観点はどれ？（複数選択）",
        type: "multi",
        options: [
            "request.args / form からの入力",
            "文字列連結で SQL を構築",
            "cursor.execute に直接渡しているか",
            "DB への接続方式"
        ],
        answer: ["0","1","2"],
        explanation: "入力 → 連結 → SQL実行 のデータフローを追います。",
        link: "/exercise6"
    },

    {
        q: "静的解析の弱点は？",
        type: "single",
        options: [
            "コードを読めない",
            "実際の挙動は確認できない",
            "常に誤検知になる",
            "DBを停止させる"
        ],
        answer: ["1"],
        explanation: "静的解析はコードだけを見て判断するため、挙動の差分は取れません。",
        link: "/exercise6"
    },

    /* ---- 演習7：動的解析 ---- */
    {
        q: "動的解析（差分解析）のポイントは？（複数選択）",
        type: "multi",
        options: [
            "正常系（ベースライン）を取得する",
            "攻撃ペイロードを送る",
            "レスポンス差分を比較する",
            "結果が同じでも常に成功と判定する"
        ],
        answer: ["0","1","2"],
        explanation: "ベースライン → ペイロード → 差分が動的解析の基本です。",
        link: "/exercise7"
    },

    {
        q: "レスポンス長が大きく変化した場合に考えられることは？",
        type: "single",
        options: [
            "SQLi成功の可能性",
            "必ずネットワークエラー",
            "HTMLが壊れているだけ",
            "安全な実装である"
        ],
        answer: ["0"],
        explanation: "UNION攻撃やエラー表示によりレスポンス量が変わるため重要な指標です。",
        link: "/exercise7"
    },

    /* ---- 演習8：防御SQL ---- */
    {
        q: "パラメトリクエリが安全な理由として正しいのは？",
        type: "single",
        options: [
            "SQL文と値を分離して扱うため",
            "パスワードを暗号化するため",
            "常にSQLを高速化するため",
            "DBの種類を自動判定するため"
        ],
        answer: ["0"],
        explanation: "値は“値”として扱われ、SQL構造に影響を与えません。",
        link: "/exercise8"
    },

    {
        q: "プレースホルダを使った場合、攻撃ペイロード `' OR '1'='1` はどう処理される？",
        type: "single",
        options: [
            "SQL文の一部として実行される",
            "単なる文字列として扱われる",
            "自動的に削除される",
            "DBが応答を停止する"
        ],
        answer: ["1"],
        explanation: "パラメトリクエリではSQL構造に影響を与えず値として扱われます。",
        link: "/exercise8"
    },

    {
        q: "安全なSQL実装でも必要な追加対策は？（複数選択）",
        type: "multi",
        options: [
            "入力値の形式チェック",
            "レート制限",
            "ログ監視",
            "攻撃者へのレスポンス強調"
        ],
        answer: ["0","1","2"],
        explanation: "安全なSQLだけでは不十分で、周辺対策も重要です。",
        link: "/exercise8"
    }
];


/* ===== ランダムシャッフル ===== */
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let r = Math.floor(Math.random() * (i + 1));
        [array[i], array[r]] = [array[r], array[i]];
    }
}
shuffle(questions);

const form = document.getElementById("quizForm");

/* ===== 問題を描画 ===== */
questions.forEach((q, idx) => {
    let html = `<div id="qhead${idx}" class="question">${idx+1}. ${q.q}</div>`;


    q.options.forEach((opt, i) => {
        const name = q.type === "single" ? `q${idx}` : `q${idx}[]`;
        const type = q.type === "single" ? "radio" : "checkbox";

        html += `
            <div class="option">
                <label>
                    <input type="${type}" name="${name}" value="${i}">
                    ${opt}
                </label>
            </div>`;
    });

    html += `<div id="ex${idx}" class="explanation"></div>`;
    html += "<hr>";
    form.innerHTML += html;
});

function checkAnswers() {
    const finishBtn = document.getElementById("finishBtn");

    let score = 0;  // 得点カウンター

    questions.forEach((q, idx) => {
        const userAnswers = [];
        const selectedInputs = document.querySelectorAll(
            `input[name='q${idx}']:checked, input[name='q${idx}[]']:checked`
        );

        selectedInputs.forEach(i => userAnswers.push(i.value));

        const ua = userAnswers.sort().join(",");
        const aa = q.answer.sort().join(",");

        /* --- 正誤表示 --- */
        const questionHeader = document.querySelector(`#qhead${idx}`);
        if (ua === aa) {
            questionHeader.innerHTML += ` <span class="correct">〇 正解</span>`;
            score++;
        } else {
            questionHeader.innerHTML += ` <span class="incorrect">✕ 不正解</span>`;
        }

        /* --- 選択肢ハイライト処理 --- */
        const allOptions = document.querySelectorAll(
            `input[name='q${idx}'], input[name='q${idx}[]']`
        );

        allOptions.forEach(opt => {
            const optDiv = opt.closest(".option");

            // 正解の選択肢
            if (q.answer.includes(opt.value)) {
                optDiv.classList.add("correct-option");
            }

            // 不正解で選択したもの
            if (opt.checked && !q.answer.includes(opt.value)) {
                optDiv.classList.add("incorrect-option");
            }
        });

        /* --- 解説表示 --- */
        const ex = document.getElementById(`ex${idx}`);
        ex.style.display = "block";
        ex.innerHTML = `
            <b>解説：</b> ${q.explanation}
            <div class="link">
                <a href="${q.link}" target="_blank">▶ 詳しく学ぶ（関連演習メニュー）</a>
            </div>
        `;
    });

    /* --- 全選択肢を無効化 --- */
    const allInputs = document.querySelectorAll("input");
    allInputs.forEach(i => i.disabled = true);

    finishBtn.disabled = true;

    /* --- 得点表示 --- */
    document.getElementById("resultArea").innerHTML = `
        <div class="result">
            <h3>得点：${score} / ${questions.length} 点</h3>
        </div>
    `;

        /* --- 満点だった場合のみ進捗をDBに保存 --- */
    if (score === questions.length) {
        fetch("/set_achievement/exercise9", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                exercise: "exercise9"   // ← このテストに対応する演習名
            })
        })
        .then(res => res.json())
        .then(data => {
            console.log("進捗登録:", data);
            // 画面にも表示
            const doneMsg = document.createElement("div");
            doneMsg.style.color = "#27ae60";
            doneMsg.style.marginTop = "10px";
            doneMsg.innerHTML = "✔ このテストに満点のため、進捗として登録されました！";
            document.getElementById("resultArea").appendChild(doneMsg);
        })
        .catch(err => console.error("進捗登録エラー:", err));
    } else {
        const warnMsg = document.createElement("div");
        warnMsg.style.color = "#c0392b";
        warnMsg.style.marginTop = "10px";
        warnMsg.innerHTML = "✕ 満点ではないため進捗登録されません。";
        document.getElementById("resultArea").appendChild(warnMsg);
    }


    /* --- もう一度トライするボタン --- */
    const retryBtn = document.createElement("button");
    retryBtn.textContent = "もう一度トライする";
    retryBtn.className = "btn-primary";
    retryBtn.style.marginTop = "15px";
    retryBtn.onclick = () => location.reload();
    document.getElementById("resultArea").appendChild(retryBtn);
}
</script>

<script>
        function toggle(id) {
            const box = document.getElementById(id);
            box.style.display = (box.style.display === "block") ? "none" : "block";
        }
    </script>
    
<div style="text-align:center; margin-top: 20px;">
    <a href="/home"
       style="
           display:inline-block;
           background:#3498db;
           color:white;
           padding:10px 20px;
           border-radius:6px;
           text-decoration:none;
           font-size:16px;
           margin-bottom: 20px;
       ">
        ← ホームに戻る
    </a>
</div>

</body>
</html>
