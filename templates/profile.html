<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ユーザー情報編集</title>

<style>
    body {
        background: #f5f7fa;
        font-family: Arial, sans-serif;
        margin: 0;
    }

    .header {
        background: #2c3e50;
        color: white;
        padding: 15px;
        font-size: 22px;
        font-weight: bold;
    }

    .header-sub {
        font-size: 13px;
        font-weight: normal;
        color: #bdc3c7;
        margin-top: 4px;
    }

    .wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
        }

    .menu-wrapper {
        position: absolute;
        right: 20px;
        top: 12px;
        }

    /* ハンバーガーアイコン */
        .hamburger {
            font-size: 26px;
            cursor: pointer;
            user-select: none;
            padding: 4px 6px;
        }

        /* hover時に menu を表示（ここが重要） */
        .menu-wrapper:hover .menu {
            display: block;
        }

        /* メニュー内容 */
        .menu {
            display: none;
            position: absolute;
            right: 0;
            top: 36px;
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            width: 180px;
        }

        /* メニューの各リンク */
        .menu a {
            all: unset;
            display: block;
            padding: 12px 15px;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #2980b9, #3498db);
            color: #fff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: 0.2s;
        }

        .menu a:hover {
            background: linear-gradient(135deg, #3498db, #5dade2);
            transform: translateY(-2px);
        }


    .container {
        width: 380px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid #bbb;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #2980b9;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
    }
    button:hover {
        background: #3498db;
    }

    .delete-btn {
        background: #c0392b;
        margin-top: 10px;
    }
    .delete-btn:hover {
        background: #e74c3c;
    }

    .msg {
        color: red;
        margin-bottom: 10px;
        text-align: center;
    }

    .back-link {
        margin-top: 12px;
        text-align: center;
    }
</style>

</head>

<body>

    <div class="header">
        SQLi Learning
        <div class="header-sub">アカウント設定</div>
        <div class="menu-wrapper">
        <div class="hamburger">☰</div>
        <div class="menu">
            <a href="/home">ホーム</a>
            <a href="/setlang/ja">日本語</a>
            <a href="/setlang/en">English</a>
            <a href="/login">ログイン画面</a>
        </div>
    </div>
    </div>

    <div class="wrapper">
        <div class="container">

            <h2>アカウント情報</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="msg">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}

            <!-- ユーザー情報更新フォーム -->
            <form method="POST" autocomplete="off">
                <label>ユーザー名：</label>
                <input type="text" name="username" value="{{ user[1] }}" autocomplete="off">

                <label>パスワード（変更する場合のみ入力）：</label>
                <input type="password" name="new_password" autocomplete="new-password">

                <button type="submit">更新する</button>
            </form>

            <!-- アカウント削除フォーム -->
            <form method="POST" action="/delete_user">
                <button type="submit" class="delete-btn">アカウントを削除する</button>
            </form>

            <div class="back-link">
                <a href="/home">← ホームへ戻る</a>
            </div>

        </div>
    </div>

</body>
</html>
